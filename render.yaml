services:
  - type: web
    name: graphcyrag-app
    env: python
    plan: free
    buildCommand: "cd frontend && rm -rf package-lock.json node_modules && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: NODE_VERSION
        value: "20.15.0"
      - key: NEO4J_URI
        value: "bolt://your-neo4j-host:7687"
      - key: NEO4J_USER
        value: "neo4j"
      - key: NEO4J_PASSWORD
        value: "password"
