services:
  - type: web
    name: graphcyrag-api
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: CORS_ORIGINS
        value: "*"
      - key: NEO4J_URI
        value: "bolt://localhost:7687"
      - key: NEO4J_USERNAME
        value: "neo4j"
      - key: NEO4J_PASSWORD
        value: "changeme_neo4j_password"
      - key: DATA_PROCESSED_DIR
        value: "../data/processed"
